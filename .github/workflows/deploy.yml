
name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: 1. Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  package:
    name: 2. Package Application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release Package
        run: |
          tar -czf release.tar.gz \
            package.json \
            package-lock.json \
            server.js \
            ecosystem.config.js

          ls -lh release.tar.gz

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-release
          path: release.tar.gz

  deploy:
    name: 3. Deploy to EC2
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-release
          path: ./release

      - name: Verify Release Package
        run: ls -lh ./release/release.tar.gz

      - name: Prepare EC2 Directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/nodeapp

      - name: Copy Release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./release/release.tar.gz"
          target: "/home/${{ secrets.EC2_USERNAME }}/nodeapp/"
          strip_components: 1

      - name: Install and Start Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/nodeapp
            tar -xzf release.tar.gz
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save

  verify:
    name: 4. Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check Application Health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pm2 status
            curl -f http://127.0.0.1:3000/health
            echo "Deployment verification successful!"
